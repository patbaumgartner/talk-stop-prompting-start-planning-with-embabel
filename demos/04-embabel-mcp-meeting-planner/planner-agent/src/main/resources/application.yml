spring:
  application:
    name: planner-agent
  ai:
    mcp:
      client:
        enabled: true
        type: SYNC
        stdio:
          connections:
            location:
              command: java
              args:
                - -Dspring.ai.mcp.server.stdio=true
                - -jar
                - "${LOCATION_MCP_JAR:${user.dir}/../location-mcp/target/location-mcp-1.0.0-SNAPSHOT.jar}"

embabel:
  models:
    default-llm: gpt-5-mini

logging:
  level:
    # Planning, replanning, actions and tool events use the separate Embabel logger
    Embabel: INFO
    com.embabel: DEBUG
    com.patbaumgartner.embabel: DEBUG
    org.springframework.ai.mcp: INFO
    io.modelcontextprotocol.client: INFO
    # Forward the MCP subprocess's stderr logs without tracing JSON-RPC payloads
    io.modelcontextprotocol.client.transport.StdioClientTransport: INFO
